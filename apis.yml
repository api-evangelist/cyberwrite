aid: cyberwrite
name: Cyberwrite
description: >-
  Cyberwrite is an AI-powered cyber insurance intelligence platform that turns raw data into
  explainable, defensible financial decisions for the cyber insurance lifecycle. Founded in 2016
  and operating from Tel Aviv and New York, its platform combines the 4SEEN AI risk-profiling
  algorithm with Vivaldi cyber insurance orchestration to deliver real-time cyber risk analytics,
  cyber risk quantification, third-party risk management, and cyber catastrophe (accumulation)
  modeling. Users enter a company name, URL, industry, and country and receive a one-page cyber
  risk report in under a minute, with coverage spanning the vast majority of businesses globally in
  multiple languages. Cyberwrite delivers its data to insurers, reinsurers, brokers, MGAs,
  corporates, ILS investors, and private equity firms in real time through the Cyberwrite API for
  underwriting automation and aggregated portfolio risk management. Partners include Markel, Howden,
  HSB, Mastercard Start Path, and Navacord. Added to the API Evangelist network via the speedinvest
  portfolio and enriched here from Cyberwrite's public web surface.
